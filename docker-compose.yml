services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: clickid/web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - 8000
    # Temporary: publish web port to host for testing without nginx
    # NOTE: remove this port mapping in production; use nginx as reverse proxy instead.
    ports:
      - "8000:8000"
    # Temporary override: increase gunicorn timeout so long-running imports won't hit the default 30s worker timeout.
    # This is a mitigation only — long-term fix: run imports in background (Celery) or use bulk_create and optimize inserts.
    command: ["gunicorn", "clickid_core.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "300", "--limit-request-line", "16384", "--limit-request-field_size", "16384", "--log-level", "info"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: clickid/celery:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: ["celery", "-A", "clickid_core", "worker", "-l", "info", "--concurrency", "2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
      - certs:/etc/letsencrypt
      - ./deploy/nginx/webroot:/var/www/certbot
    depends_on:
      web:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    restart: 'no'
    env_file:
      - .env
    environment:
      # Comma-separated domains (e.g. example.com,www.example.com)
      - LETSENCRYPT_DOMAINS=${LETSENCRYPT_DOMAINS}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - certs:/etc/letsencrypt
      - ./deploy/nginx/webroot:/var/www/certbot
    # Run certbot in one-shot mode using the webroot plugin to obtain certificates.
    # This container is intended to be started manually (or via CI) to request/renew certs.
    # Example: docker compose run --rm certbot
    command: ["sh", "-c", "certbot certonly --webroot -w /var/www/certbot -d ${LETSENCRYPT_DOMAINS} --email ${LETSENCRYPT_EMAIL} --agree-tos --non-interactive --no-eff-email"]

volumes:
  pgdata:
  static_volume:
  media_volume:
  certs:
