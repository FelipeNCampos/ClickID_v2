services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-clickid_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-clickid_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: clickid/web:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DB_NAME: ${DB_NAME:-clickid_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - 8000
    command: ["gunicorn", "clickid_core.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--worker-class", "gthread", "--threads", "4", "--timeout", "120", "--limit-request-line", "16384", "--limit-request-field_size", "16384", "--log-level", "info"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    image: clickid/celery:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["celery", "-A", "clickid_core", "worker", "-l", "info"]
    environment:
      DB_NAME: ${DB_NAME:-clickid_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
      - certs:/etc/letsencrypt
      - ./deploy/nginx/webroot:/var/www/certbot
    depends_on:
      web:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    restart: 'no'
    volumes:
      - certs:/etc/letsencrypt
      - ./deploy/nginx/webroot:/var/www/certbot

volumes:
  pgdata:
  static_volume:
  media_volume:
  certs:

networks:
  default:
    name: clickid_default
